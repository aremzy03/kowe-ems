<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#FBF6EC;color:#211F26;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FBF6EC;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #211F26;border-radius:8px;">
          <tr>
            <td style="background:#5B3DE8;padding:16px 24px;border-radius:8px 8px 0 0;">
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;letter-spacing:0.04em;color:#FBF6EC;">{{ school_name }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#211F26;">
              {% block content %}{% endblock %}
            </td>
          </tr>
        </table>
        <p style="max-width:560px;margin:16px auto 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;color:#5c5666;">
          Sent by {{ school_name }} through Kowe. If you were not expecting this message, you can ignore it.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
